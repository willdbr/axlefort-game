<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AxleFort: Tactical Siege</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-[#090D16] text-slate-100 font-sans m-0 p-0 flex flex-col min-h-screen">
    <div id="root" class="flex-1 flex flex-col"></div>

    <script>
      const { useState, createElement: h } = React;

      function App() {
        const [screen, setScreen] = useState('menu'); // 'menu', 'builder', 'battle'
        const [blocks, setBlocks] = useState([ { id: 1, type: 'wood', hp: 100 }, { id: 2, type: 'stone', hp: 200 } ]);
        const [statusText, setStatusText] = useState('Base estável e pronta para o combate.');

        // Simulação do motor de física / estabilidade BFS
        const addBlock = (type) => {
          const newBlock = { id: Date.now(), type, hp: type === 'stone' ? 200 : 100 };
          setBlocks([...blocks, newBlock]);
          setStatusText(`Bloco de ${type.toUpperCase()} adicionado à estrutura!`);
        };

        const simulatePhysics = () => {
          if (blocks.length === 0) {
            setStatusText('Aviso: Estrutura vazia! Adicione blocos para testar.');
            return;
          }
          setStatusText('Simulação de estabilidade BFS executada: Estrutura coesa e firme!');
        };

        if (screen === 'menu') {
          return h('div', { className: 'flex-1 flex flex-col items-center justify-center p-6 text-center' },
            h('div', { className: 'max-w-md w-full bg-[#131B2E] border border-emerald-500/30 p-6 rounded-2xl shadow-2xl space-y-4' },
              h('h1', { className: 'text-3xl font-black text-emerald-400 tracking-wider' }, 'AXLEFORT'),
              h('p', { className: 'text-sm text-slate-400' }, 'Tactical Siege & Physics Sandbox'),
              h('button', {
                onClick: () => setScreen('builder'),
                className: 'w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition-all active:scale-95 cursor-pointer'
              }, 'CONSTRUIR CASTELO (S03)'),
              h('button', {
                onClick: () => setScreen('battle'),
                className: 'w-full py-4 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl shadow-lg transition-all active:scale-95 cursor-pointer'
              }, 'ARENA DE BATALHA 1V1 (S07)')
            )
          );
        }

        if (screen === 'builder') {
          return h('div', { className: 'flex-1 flex flex-col p-4 max-w-md mx-auto w-full justify-between' },
            h('div', { className: 'space-y-4' },
              h('div', { className: 'flex justify-between items-center bg-[#131B2E] p-4 rounded-xl border border-slate-800' },
                h('h2', { className: 'font-bold text-emerald-400' }, 'Editor de Castelo'),
                h('button', { onClick: () => setScreen('menu'), className: 'text-xs bg-slate-800 px-3 py-1.5 rounded-lg text-slate-300' }, 'Menu')
              ),
              h('div', { className: 'p-4 bg-slate-900 rounded-xl border border-slate-800 min-h-[140px] flex flex-col items-center justify-center text-center' },
                h('p', { className: 'text-sm font-semibold text-emerald-300' }, statusText),
                h('p', { className: 'text-xs text-slate-500 mt-2' }, `Blocos na estrutura: ${blocks.length}`)
              ),
              h('div', { className: 'grid grid-cols-2 gap-3' },
                h('button', { onClick: () => addBlock('wood'), className: 'py-3 bg-amber-800 text-white rounded-xl font-bold shadow' }, '+ Bloco Madeira'),
                h('button', { onClick: () => addBlock('stone'), className: 'py-3 bg-slate-700 text-white rounded-xl font-bold shadow' }, '+ Bloco Pedra')
              )
            ),
            h('button', {
              onClick: simulatePhysics,
              className: 'w-full py-4 bg-emerald-600 text-white font-bold rounded-xl shadow-lg mt-4'
            }, 'Testar Estabilidade Física')
          );
        }

        if (screen === 'battle') {
          return h('div', { className: 'flex-1 flex flex-col p-4 max-w-md mx-auto w-full justify-between' },
            h('div', { className: 'space-y-4' },
              h('div', { className: 'flex justify-between items-center bg-[#131B2E] p-4 rounded-xl border border-slate-800' },
                h('h2', { className: 'font-bold text-sky-400' }, 'Arena de Batalha 1v1'),
                h('button', { onClick: () => setScreen('menu'), className: 'text-xs bg-slate-800 px-3 py-1.5 rounded-lg text-slate-300' }, 'Menu')
              ),
              h('div', { className: 'p-6 bg-slate-900 rounded-xl border border-slate-800 text-center space-y-3' },
                h('div', { className: 'text-lg font-bold text-slate-200' }, 'Fase de Disparo Balístico'),
                h('p', { className: 'text-xs text-slate-400' }, 'A calcular o arco parabólico sob gravidade e vento lateral...'),
                h('div', { className: 'w-full bg-sky-950/50 border border-sky-500/30 p-4 rounded-lg text-sky-400 font-mono text-sm' }, 'Impacto estimado: Alvo inimigo a 180m')
              )
            ),
            h('button', {
              onClick: () => setStatusText('Projétil disparado com sucesso! Dano aplicado nas paredes.'),
              className: 'w-full py-4 bg-sky-600 text-white font-bold rounded-xl shadow-lg mt-4'
            }, 'Disparar Artilharia')
          );
        }
      }

      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
