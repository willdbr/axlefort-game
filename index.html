<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AxleFort: Tactical Siege</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-[#090D16] text-slate-100 font-sans m-0 p-0 flex flex-col min-h-screen select-none overflow-hidden">
    <div id="root" class="flex-1 flex flex-col h-screen"></div>

    <script>
      const { useState, useEffect, useRef, createElement: h } = React;

      function App() {
        const [screen, setScreen] = useState('menu'); // 'menu', 'game'
        const [selectedTool, setSelectedTool] = useState('wood'); // 'wood', 'stone', 'cannon', 'delete'
        const [statusText, setStatusText] = useState('Toque na grade para construir ou posicionar canhões.');
        
        // Elementos do mundo do jogo
        const [entities, setEntities] = useState([
          { id: 1, type: 'stone', x: 250, y: 320, w: 40, h: 40, hp: 200 },
          { id: 2, type: 'wood', x: 210, y: 320, w: 40, h: 40, hp: 100 },
          { id: 3, type: 'wood', x: 290, y: 320, w: 40, h: 40, hp: 100 },
          { id: 4, type: 'cannon', x: 60, y: 320, w: 50, h: 40, hp: 150 },
          { id: 5, type: 'enemy', x: 550, y: 320, w: 45, h: 60, hp: 250 }
        ]);

        const [projectiles, setProjectiles] = useState([]);
        const [particles, setParticles] = useState([]);
        const canvasRef = useRef(null);

        // Loop de Renderização Gráfica (Canvas 2D)
        useEffect(() => {
          if (screen !== 'game') return;
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let animationFrameId;

          // Ajustar tamanho real do canvas para mobile
          canvas.width = canvas.parentElement.clientWidth;
          canvas.height = canvas.parentElement.clientHeight;

          const render = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Desenhar Fundo (Céu e Solo Estilizado)
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0f172a');
            gradient.addColorStop(1, '#1e1b4b');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Linha do Chão
            ctx.fillStyle = '#065f46';
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
            ctx.fillStyle = '#10b981';
            ctx.fillRect(0, canvas.height - 80, canvas.width, 6);

            // 2. Desenhar Entidades (Blocos, Canhões, Inimigos)
            entities.forEach(ent => {
              ctx.save();
              if (ent.type === 'wood') {
                ctx.fillStyle = '#92400e';
                ctx.strokeStyle = '#b45309';
                ctx.fillRect(ent.x, canvas.height - 80 - ent.y, ent.w, ent.h);
                ctx.strokeRect(ent.x, canvas.height - 80 - ent.y, ent.w, ent.h);
                // Detalhe de textura da madeira
                ctx.fillStyle = '#78350f';
                ctx.fillRect(ent.x + 8, canvas.height - 80 - ent.y + 8, ent.w - 16, 4);
              } else if (ent.type === 'stone') {
                ctx.fillStyle = '#475569';
                ctx.strokeStyle = '#64748b';
                ctx.fillRect(ent.x, canvas.height - 80 - ent.y, ent.w, ent.h);
                ctx.strokeRect(ent.x, canvas.height - 80 - ent.y, ent.w, ent.h);
                // Detalhe de pedra
                ctx.fillStyle = '#334155';
                ctx.fillRect(ent.x + 6, canvas.height - 80 - ent.y + 6, 12, 12);
              } else if (ent.type === 'cannon') {
                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(ent.x, canvas.height - 80 - ent.y + 10, 40, 30);
                // Cano do canhão
                ctx.fillStyle = '#1e3a8a';
                ctx.fillRect(ent.x + 25, canvas.height - 80 - ent.y + 5, 25, 14);
              } else if (ent.type === 'enemy') {
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(ent.x + ent.w/2, canvas.height - 80 - ent.y + ent.h/2, ent.w/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#b91c1c';
                ctx.lineWidth = 3;
                ctx.stroke();
              }
              ctx.restore();
            });

            // 3. Desenhar Projéteis em movimento
            setProjectiles(prev => prev.map(p => {
              const nx = p.x + p.vx;
              const ny = p.y + p.vy;
              const nvy = p.vy - 0.4; // gravidade
              
              ctx.fillStyle = '#f59e0b';
              ctx.beginPath();
              ctx.arc(nx, canvas.height - 80 - ny, 6, 0, Math.PI * 2);
              ctx.fill();

              return { ...p, x: nx, y: ny, vy: nvy };
            }).filter(p => p.y > 0 && p.x < canvas.width));

            // 4. Desenhar Partículas de explosão/destruição
            setParticles(prev => prev.map(pt => {
              ctx.fillStyle = pt.color;
              ctx.fillRect(pt.x, canvas.height - 80 - pt.y, pt.size, pt.size);
              return { ...pt, x: pt.x + pt.vx, y: pt.y + pt.vy, size: Math.max(0, pt.size - 0.2) };
            }).filter(pt => pt.size > 0));

            animationFrameId = requestAnimationFrame(render);
          };

          animationFrameId = requestAnimationFrame(render);
          return () => cancelAnimationFrame(animationFrameId);
        }, [screen, entities, projectiles, particles]);

        // Interação de Toque no Canvas (Construir ou Disparar)
        const handleCanvasClick = (e) => {
          const canvas = canvasRef.current;
          const rect = canvas.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const clickY = canvas.height - 80 - (e.clientY - rect.top); // inverter eixo Y para o chão

          if (selectedTool === 'wood' || selectedTool === 'stone') {
            // Alinhar à grade visual
            const gx = Math.floor(clickX / 40) * 40;
            const gy = Math.floor(clickY / 40) * 40;
            const newEntity = { id: Date.now(), type: selectedTool, x: gx, y: gy, w: 40, h: 40, hp: selectedTool === 'stone' ? 200 : 100 };
            setEntities([...entities, newEntity]);
            setStatusText(`Bloco de ${selectedTool} posicionado visualmente!`);
          } else if (selectedTool === 'cannon') {
            // Disparar projétil a partir do canhão
            const newProj = { id: Date.now(), x: 90, y: 340, vx: 9, vy: 7 };
            setProjectiles(prev => [...prev, newProj]);
            setStatusText('🔥 Canhão disparado! Acompanhe o projétil no ar.');

            // Simular impacto e destruição visual após 1.2 segundos
            setTimeout(() => {
              // Gerar partículas de explosão
              const newParts = Array.from({ length: 15 }).map(() => ({
                x: 560 + (Math.random() * 30 - 15),
                y: 340 + (Math.random() * 30 - 15),
                vx: Math.random() * 6 - 3,
                vy: Math.random() * 6 - 3,
                size: Math.random() * 6 + 4,
                color: Math.random() > 0.5 ? '#f59e0b' : '#ef4444'
              }));
              setParticles(prev => [...prev, ...newParts]);
              setStatusText('💥 IMPACTO NA FORTIFICAÇÃO! Blocos e inimigos atingidos!');
              
              // Danificar inimigo / remover entidade
              setEntities(prev => prev.map(ent => ent.type === 'enemy' ? { ...ent, hp: Math.max(0, ent.hp - 100) } : ent));
            }, 1200);
          }
        };

        if (screen === 'menu') {
          return h('div', { className: 'flex-1 flex flex-col items-center justify-center p-6 text-center bg-gradient-to-b from-[#090D16] to-[#1e1b4b]' },
            h('div', { className: 'max-w-md w-full bg-[#131B2E]/90 border border-emerald-500/30 p-8 rounded-3xl shadow-2xl space-y-6 backdrop-blur-md' },
              h('div', { className: 'space-y-2' },
                h('h1', { className: 'text-4xl font-black text-emerald-400 tracking-wider' }, 'AXLEFORT'),
                h('p', { className: 'text-xs text-slate-400 uppercase tracking-widest' }, 'Tactical Siege & Graphics Engine')
              ),
              h('button', {
                onClick: () => setScreen('game'),
                className: 'w-full py-5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl shadow-xl transition-all active:scale-95 cursor-pointer text-lg flex items-center justify-center gap-2'
              }, '🎮 JOGAR COM GRÁFICOS')
            )
          );
        }

        return h('div', { className: 'flex-1 flex flex-col h-full justify-between bg-slate-950' },
          // Barra Superior
          h('div', { className: 'flex justify-between items-center bg-[#131B2E] p-3 border-b border-slate-800 z-10' },
            h('div', { className: 'flex items-center gap-2' },
              h('span', { className: 'font-bold text-emerald-400 text-sm' }, 'AxleFort Arena'),
              h('span', { className: 'text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-300' }, `Inimigo HP: ${entities.find(e => e.type === 'enemy')?.hp || 0}`)
            ),
            h('button', { onClick: () => setScreen('menu'), className: 'text-xs bg-slate-800 px-3 py-1.5 rounded-lg text-slate-300' }, 'Sair')
          ),

          // Tela Gráfica (Canvas)
          h('div', { className: 'flex-1 relative w-full overflow-hidden' },
            h('canvas', {
              ref: canvasRef,
              onClick: handleCanvasClick,
              className: 'w-full h-full cursor-crosshair touch-none'
            }),
            h('div', { className: 'absolute top-3 left-3 bg-slate-900/80 backdrop-blur border border-slate-800 px-3 py-1.5 rounded-xl pointer-events-none' },
              h('p', { className: 'text-[11px] text-emerald-400 font-medium' }, statusText)
            )
          ),

          // Barra de Ferramentas Inferior (Ferramentas Visuais)
          h('div', { className: 'bg-[#131B2E] p-3 border-t border-slate-800 flex justify-around gap-2 z-10' },
            [
              { id: 'wood', label: '🪵 Madeira' },
              { id: 'stone', label: '🧱 Pedra' },
              { id: 'cannon', label: '🔥 Disparar' }
            ].map(tool =>
              h('button', {
                key: tool.id,
                onClick: () => setSelectedTool(tool.id),
                className: `flex-1 py-3 rounded-xl text-xs font-bold transition-all border ${
                  selectedTool === tool.id 
                    ? 'bg-emerald-600 border-emerald-400 text-white shadow-lg scale-105' 
                    : 'bg-slate-900 border-slate-800 text-slate-400'
                }`
              }, tool.label)
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
